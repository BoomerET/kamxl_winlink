<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tncstation telemetry</title>
<script src="../_shared/theme.js"></script>
<link rel="stylesheet" href="../_shared/theme.css">
<script src="../_shared/features.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="paneHeader">
  <span>TELEMETRY</span>
  <span>
    <a href="#" id="homeLink">home</a>
    <a href="#" id="terminalLink" data-feature="terminal">terminal</a>
    <a href="#" id="mapLink">map</a>
    <a href="#" id="logLink">log</a>
    <a href="#" id="pbbsLink" data-feature="pbbs">pbbs</a>
    <a href="#" id="winlinkLink" data-feature="winlink">winlink</a>
  </span>
</div>
<div id="content">
  <div class="controls">
    <label for="days">Over the last</label>
    <select id="days">
      <option value="1">day</option>
      <option value="7" selected>7 days</option>
      <option value="30">30 days</option>
      <option value="90">90 days</option>
      <option value="365">year</option>
    </select>
    <label for="stationSelect" class="phoneOnly">Station</label>
    <select id="stationSelect" class="phoneOnly"></select>
  </div>
  <div id="status" role="status" aria-live="polite">Loading...</div>
  <div class="layout">
    <nav id="stationList" aria-label="Stations sending telemetry"></nav>
    <main id="station"></main>
  </div>
</div>
<div id="tooltip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
