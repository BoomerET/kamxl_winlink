<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tncstation web terminal</title>
<script src="../_shared/theme.js"></script>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="monitorPane">
  <div class="paneHeader">
    <span>LIVE MONITOR <span id="monitorStatus" class="connecting">connecting</span></span>
    <button id="clearMonitor" type="button">clear</button>
  </div>
  <div id="monitorFeed"></div>
</div>
<div id="terminalPane">
  <div class="paneHeader">
    <span>TERMINAL</span>
    <span>
      <a href="#" id="homeLink">home</a>
      <a href="#" id="pbbsLink">pbbs</a>
      <a href="#" id="mapLink">map</a>
      <a href="#" id="winlinkLink">winlink</a>
      <a href="#" id="logLink">log</a>
      <a href="#" id="telemetryLink">telemetry</a>
    </span>
  </div>
  <div id="output"></div>
  <div id="inputRow">
    <div id="prompt">cmd:</div>
    <input id="cmdInput" autocomplete="off" autofocus
           placeholder="type a TNC command and press Enter..." />
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
