<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tncstation packet log</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="paneHeader">
  <span>PACKET LOG</span>
  <span>
    <a href="#" id="homeLink">home</a>
    <a href="#" id="terminalLink">terminal</a>
    <a href="#" id="mapLink">map</a>
    <a href="#" id="telemetryLink">telemetry</a>
    <a href="#" id="pbbsLink">pbbs</a>
    <a href="#" id="winlinkLink">winlink</a>
  </span>
</div>
<div id="content">
  <form id="searchForm" role="search">
    <label>From
      <input id="callsign" name="callsign" autocomplete="off"
             autocapitalize="characters" placeholder="W5NGU, W5NGU-3, W5N*">
    </label>
    <label>Via digipeater
      <input id="via" name="via" autocomplete="off"
             autocapitalize="characters" placeholder="W5NGU-3">
    </label>
    <label>Packet text
      <input id="text" name="text" autocomplete="off" maxlength="100"
             placeholder="146.94, WX, :N5BA">
    </label>
    <label>Heard in the last
      <select id="days" name="days">
        <option value="1">day</option>
        <option value="7" selected>7 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
        <option value="365">year</option>
        <option value="0">all time</option>
      </select>
    </label>
    <span class="buttons">
      <button type="submit">Search</button>
      <button type="button" id="clearBtn">Clear</button>
    </span>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="summary" hidden></div>
  <div id="results"></div>
  <button type="button" id="moreBtn" hidden>Load older</button>
</div>
<script src="app.js"></script>
</body>
</html>
