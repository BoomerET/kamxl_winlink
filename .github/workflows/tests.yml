name: Tests

# Runs the offline test suite (no KAM-XL hardware needed) on every pull
# request and every push to main, so a PR shows a green check or red X
# before it's merged.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pyflakes checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # flake8 limited to the pyflakes checks (F): unused imports and
      # variables, undefined names, ... No style rules. flake8 rather
      # than plain pyflakes because it honours "# noqa: F401" on the
      # deliberate re-exports (kamxl.py and friends).
      - name: flake8 --select=F
        run: |
          python -m pip install flake8
          python -m flake8 --select=F .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10: the oldest supported (requires-python). 3.13: Raspberry
        # Pi 3B+ (Raspberry Pi OS). 3.14: the Maestro laptop.
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Node runs the dashboard JavaScript checks in the suite.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install "pyserial>=3.5"

      - name: Check web page JavaScript syntax
        run: |
          for f in tncstation_web/*/app.js tncstation_web/_shared/*.js; do echo "node --check $f"; node --check "$f"; done

      - name: Run test suite
        run: python run_tests.py
