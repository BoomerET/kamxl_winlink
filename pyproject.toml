[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tncstation"
version = "0.1.0"
description = "Packet radio station for hardware TNCs (Kantronics KAM-XL, NA6D OpenTNC): Python library, APRS daemon and web dashboard"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Dave Berkompas", email = "david.berkompas@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
]
keywords = ["ham radio", "amateur radio", "packet radio", "ax.25", "kantronics", "kam-xl", "opentnc", "tnc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/BoomerET/tncstation"
Repository = "https://github.com/BoomerET/tncstation"
Issues = "https://github.com/BoomerET/tncstation/issues"

[project.scripts]
tncstation-daemon = "tncstation_daemon:main"
tncstation-rest = "tncstation_rest:main"
# Old names, from before the rename -- same programs.
kamxl-daemon = "tncstation_daemon:main"
kamxl-rest = "tncstation_rest:main"

# Flat layout: all importable modules live at the repo root, alongside
# the hand-run hardware scripts (tools/) and the offline tests/
# suite. Only the importable modules are packaged -- everything else is
# left out of the distribution deliberately, since the tools/ scripts
# need a real KAM-XL on a serial port and aren't meant to ship.
#
# NOTE: aprs.py, stations.py, and winlink.py (milestones 7-8) were
# missing from this list until milestone 8's B2 extension -- a real,
# pre-existing packaging gap found while adding lzhuf.py here. Running
# from the repo root never surfaced it (Python resolves imports via cwd
# there), but a real `pip install` from this pyproject.toml would have
# shipped a package missing those modules, breaking `import winlink`
# (and therefore `import kamxl`, which imports it) for anyone actually
# installing the released package rather than running from a clone.
[tool.setuptools]
py-modules = [
    "tnc",
    "kiss",
    "kamxl",
    "opentnc",
    "packet",
    "pbbs",
    "aprs",
    "aprs_coverage",
    "aprs_telemetry",
    "db_backup",
    "stations",
    "winlink",
    "winlink_api",
    "serial_errors",
    "lzhuf",
    "tncstation_daemon",
    "tncstation_rest",
    "kamxl_daemon",
    "kamxl_rest",
    "envfile",
    "notify",
    "aprs_tx",
    "aprs_outbox",
    "reception_history",
    "reception_writer",
    "reception_stats",
]
# The web pages tncstation_rest.py serves (HTML/CSS/JS files, not Python
# strings) ship as a small package with its files as package data.
packages = ["tncstation_web"]

[tool.setuptools.package-data]
tncstation_web = ["*/index.html", "*/style.css", "*/app.js", "_shared/theme.css", "_shared/theme.js", "_shared/features.js"]
