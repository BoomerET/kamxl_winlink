[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kamxl"
version = "0.1.0"
description = "A Pythonic API for the Kantronics KAM-XL packet TNC's Terminal Mode"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Dave Berkompas", email = "david.berkompas@gmail.com" },
]
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
]
keywords = ["ham radio", "amateur radio", "packet radio", "ax.25", "kantronics", "kam-xl", "tnc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/BoomerET/kamxl_winlink"
Repository = "https://github.com/BoomerET/kamxl_winlink"
Issues = "https://github.com/BoomerET/kamxl_winlink/issues"

[project.scripts]
kamxl-daemon = "kamxl_daemon:main"
kamxl-rest = "kamxl_rest:main"

# Flat layout: all importable modules live at the repo root, alongside
# the live-hardware test scripts (*Test.py) and the offline tests/
# suite. Only the importable modules are packaged -- everything else is
# left out of the distribution deliberately, since the *Test.py scripts
# need a real KAM-XL on a serial port and aren't meant to ship.
#
# NOTE: aprs.py, stations.py, and winlink.py (milestones 7-8) were
# missing from this list until milestone 8's B2 extension -- a real,
# pre-existing packaging gap found while adding lzhuf.py here. Running
# from the repo root never surfaced it (Python resolves imports via cwd
# there), but a real `pip install` from this pyproject.toml would have
# shipped a package missing those modules, breaking `import winlink`
# (and therefore `import kamxl`, which imports it) for anyone actually
# installing the released package rather than running from a clone.
[tool.setuptools]
py-modules = [
    "kamxl",
    "packet",
    "pbbs",
    "aprs",
    "stations",
    "winlink",
    "winlink_api",
    "serial_errors",
    "lzhuf",
    "kamxl_daemon",
    "kamxl_rest",
]
